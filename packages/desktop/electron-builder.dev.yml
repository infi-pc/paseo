# FORK(editable): Electron Builder merges protocol lists when extending another config.
# Keep packaging inputs aligned with electron-builder.yml and declare only the dev scheme.
npmRebuild: false
appId: cz.infi.paseo.dev
productName: Paseo Dev
executableName: Paseo Dev
protocols:
  - name: Paseo Dev link
    schemes: [paseo-dev]
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release-dev
files:
  - dist/**/*
  # FORK(editable): checkout-style opt-in can read the profile inside the asar.
  - build/paseo-dev-profile.json
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  - "!node_modules/@getpaseo/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - "**/node_modules/typescript-language-server/**/*"
  - "**/node_modules/typescript/**/*"
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
  - from: build/paseo-dev-profile.json
    to: paseo-dev-profile.json
mac:
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon-dev.png
      to: icon.png
  icon: assets/icon-dev.icns
  notarize: false
  identity: null
  hardenedRuntime: false
  target: [dir]
